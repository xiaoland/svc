[project]
name = "sustainable-vibe-coding"
version = "15.0.0"
description = "Local development-collaboration CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic<3,>=2.13",
    "platformdirs<5,>=4",
    "filelock<4,>=3.29",
    "python-dotenv<2,>=1.2",
    "urllib3<3,>=2.7",
]

[project.optional-dependencies]
double = [
    "ruamel.yaml>=0.19.1,<0.20",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<0.38",
    "cel-expr-python==0.1.3",
]

[project.scripts]
svc = "svc_cli.cli:main"

[build-system]
requires = ["pdm-backend==2.4.9"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
package-dir = "src"
source-includes = ["tests"]
