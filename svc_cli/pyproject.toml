[project]
name = "sustainable-vibe-coding"
dynamic = ["version"]
description = "Packaged SVC corpus and local development-collaboration CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic<3,>=2.13",
    "platformdirs<5,>=4",
    "filelock<4,>=3.29",
    "jsonpatch<2,>=1.33",
    "python-dotenv<2,>=1.2",
    "semantic-version<3,>=2.10",
    "urllib3<3,>=2.7",
]

[project.optional-dependencies]
double = [
    "ruamel.yaml>=0.19.1,<0.20",
    "jsonschema>=4.26,<5",
    "cel-expr-python==0.1.3",
]

[project.scripts]
svc = "svc_cli.cli:main"

[build-system]
requires = ["pdm-backend==2.4.9", "semantic-version<3,>=2.10"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"
tag_filter = "v[0-9]*.[0-9]*.[0-9]*"
tag_regex = '^v(?P<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$'
version_format = "pdm_build:format_scm_version"
fallback_version = "0.0.0"

[tool.pdm.build]
package-dir = "src"
source-includes = ["tests", "pdm_build.py"]
