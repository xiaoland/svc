name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svc-release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm install --frozen-lockfile -d -G release
      - id: plan
        run: |
          if ! find changes -maxdepth 1 -type f -name '*.md' | grep -q .; then
            echo "No releasable fragments; leaving any existing Release PR unchanged."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plan=$(pdm run release plan --json)
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import json,sys; print(json.load(sys.stdin)["target_version"])' <<<"$plan")" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.needed == 'true'
        run: |
          pdm run release prepare
          pdm install --frozen-lockfile -d -G release
          pdm run test
          pdm build
      - if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          branch=release/svc
          git config user.name "svc-release[bot]"
          git config user.email "svc-release[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A
          unexpected=$(git diff --cached --name-only | grep -Ev '^(CHANGELOG\.md|changes/[a-z0-9][a-z0-9-]*\.(major|minor|patch)\.md|pyproject\.toml|pdm\.lock|src/manifest\.json)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Release preparation changed an unexpected path:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git commit -m "chore(release): prepare v$VERSION"
          git push --force-with-lease origin "$branch"
          existing_pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Release v$VERSION" --body "Automated SVC release candidate. Review Behavioral SemVer, migration guidance, release-metadata reasons, and generated notes."
          else
            gh pr create --base main --head "$branch" --title "Release v$VERSION" --body "Automated SVC release candidate. Review Behavioral SemVer, migration guidance, release-metadata reasons, and generated notes."
          fi
