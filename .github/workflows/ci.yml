name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G release -G test
      - run: pdm run test

  quality:
    name: Quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test
      - run: pdm run lint-tests
      - run: pdm run typecheck
      - run: pdm run lint-imports
      - run: pdm run lint-workflows

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G release
      - run: pdm build
      - run: pdm run build-monolith
      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/svc-wheel
          /tmp/svc-wheel/bin/pip install dist/*.whl
          /tmp/svc-wheel/bin/svc --help
          /tmp/svc-wheel/bin/svc lookup --name 'sections/working-protocol\.md' --json
          repo=$(mktemp -d)
          plan=$(/tmp/svc-wheel/bin/svc init "$repo" --json)
          digest=$(python -c 'import json,sys; print(json.load(sys.stdin)["plan_digest"])' <<<"$plan")
          /tmp/svc-wheel/bin/svc init "$repo" --apply "$digest"
          /tmp/svc-wheel/bin/svc status "$repo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G release
      - name: Validate the current release policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if grep -Fq 'release:none' <<<"$PR_BODY"; then
              pdm run release check-pr --base "origin/$BASE_REF" --release-none
            else
              pdm run release check-pr --base "origin/$BASE_REF"
            fi
          else
            pdm run release check-ci
          fi
      - name: Preview unconsumed release notes
        run: |
          if find changes -maxdepth 1 -type f -name '*.md' | grep -q .; then
            version=$(pdm run release plan --json | python -c 'import json,sys; print(json.load(sys.stdin)["target_version"])')
            pdm run towncrier build --draft --version "$version"
          fi
