name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pdm==2.28.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G test
      - run: pdm run test

  quality:
    name: Quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate Changie release input
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: v1.25.1
          args: batch auto --dry-run
      - run: python -m pip install pdm==2.28.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test
      - name: Validate release projections and Corpus advancement
        env:
          SVC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pdm run check-release-projections --compare-ref "$SVC_BASE_REF"
      - name: Validate CLI output schema projections and compatibility
        env:
          SVC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pdm run check-cli-output-schemas --compare-ref "$SVC_BASE_REF"
      - run: pdm run check-documents
      - run: pdm run lint-tests
      - run: pdm run typecheck
      - run: pdm run lint-imports
      - run: pdm run lint-workflows

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.28.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G test
      - run: pdm build -p svc_cli
      - run: pdm run build-monolith
      - name: Smoke-test the installed wheel
        run: |
          wheel=(svc_cli/dist/*.whl)
          test "${#wheel[@]}" -eq 1
          mkdir -p /tmp/svc-wheelhouse
          python -m pip download --dest /tmp/svc-wheelhouse "${wheel[0]}"
          sha=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${wheel[0]}")
          python tools/accept_agent_thread.py \
            --slice all \
            --wheel "${wheel[0]}" \
            --expected-sha256 "$sha" \
            --wheelhouse /tmp/svc-wheelhouse
          python -m venv /tmp/svc-wheel
          /tmp/svc-wheel/bin/pip install svc_cli/dist/*.whl
          /tmp/svc-wheel/bin/svc --help
          /tmp/svc-wheel/bin/svc run --json-schema
          /tmp/svc-wheel/bin/svc lookup --path sections/working-protocol.md --json
          repo=$(mktemp -d)
          plan=$(/tmp/svc-wheel/bin/svc init "$repo" --json)
          digest=$(python -c 'import json,sys; print(json.load(sys.stdin)["plan_digest"])' <<<"$plan")
          /tmp/svc-wheel/bin/svc init "$repo" --apply "$digest"
          /tmp/svc-wheel/bin/svc status "$repo"
