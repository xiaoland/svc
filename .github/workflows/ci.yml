name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G test
      - run: pdm run test

  quality:
    name: Quality and architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test
      - run: pdm run lint-tests
      - run: pdm run typecheck
      - run: pdm run lint-imports
      - run: pdm run lint-workflows

  distribution:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G test
      - name: Project the qualified rehearsal version
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--commit "$GITHUB_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--base "origin/$BASE_REF")
            if grep -Fq 'release:none' <<<"$PR_BODY"; then
              args+=(--release-none)
            fi
          fi
          qualification=$(pdm run release target-qualify "${args[@]}" --json)
          version=$(python -c 'import json,sys; print(json.load(sys.stdin)["pdm_build_scm_version"])' <<<"$qualification")
          echo "PDM_BUILD_SCM_VERSION=$version" >> "$GITHUB_ENV"
      - run: pdm build
      - run: pdm run build-monolith
      - name: Smoke-test the installed wheel
        run: |
          wheel=(dist/*.whl)
          test "${#wheel[@]}" -eq 1
          mkdir -p /tmp/svc-wheelhouse
          python -m pip download --dest /tmp/svc-wheelhouse "${wheel[0]}"
          sha=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${wheel[0]}")
          python tools/accept_agent_thread.py \
            --slice all \
            --wheel "${wheel[0]}" \
            --expected-sha256 "$sha" \
            --wheelhouse /tmp/svc-wheelhouse
          python -m venv /tmp/svc-wheel
          /tmp/svc-wheel/bin/pip install dist/*.whl
          /tmp/svc-wheel/bin/svc --help
          /tmp/svc-wheel/bin/svc lookup --name 'sections/working-protocol\.md' --json
          repo=$(mktemp -d)
          plan=$(/tmp/svc-wheel/bin/svc init "$repo" --json)
          digest=$(python -c 'import json,sys; print(json.load(sys.stdin)["plan_digest"])' <<<"$plan")
          /tmp/svc-wheel/bin/svc init "$repo" --apply "$digest"
          /tmp/svc-wheel/bin/svc status "$repo"

  release-policy:
    name: Release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G test
      - name: Qualify the exact source
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--commit "$GITHUB_SHA")
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--base "origin/$BASE_REF")
            if grep -Fq 'release:none' <<<"$PR_BODY"; then
              args+=(--release-none)
            fi
          fi
          pdm run release target-qualify "${args[@]}" --json
