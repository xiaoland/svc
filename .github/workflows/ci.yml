name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version: "3.11"
          version: 2.28.0
          cache: true
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test -G double
      - name: Check repository contract
        env:
          SVC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pdm run check
      - run: pdm build -p cli
      - name: Accept the built wheel
        run: |
          wheel=(cli/dist/*.whl)
          test "${#wheel[@]}" -eq 1
          mkdir -p /tmp/svc-wheelhouse
          python -m pip download --dest /tmp/svc-wheelhouse "${wheel[0]}"
          sha=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${wheel[0]}")
          python tools/accept_agent_thread.py --slice all --wheel "${wheel[0]}" --expected-sha256 "$sha" --wheelhouse /tmp/svc-wheelhouse
          python -m venv /tmp/svc-wheel
          /tmp/svc-wheel/bin/pip install "${wheel[0]}[double]"
          /tmp/svc-wheel/bin/svc --help
          mkdir -p /tmp/svc-cli-project
          python - <<'PYTHON'
          import json
          import subprocess

          def svc(*args):
              return json.loads(subprocess.check_output(["/tmp/svc-wheel/bin/svc", *args], text=True))

          plan = svc("init", "/tmp/svc-cli-project", "--json")
          applied = svc("init", "/tmp/svc-cli-project", "--apply", plan["plan_digest"], "--json")
          assert applied["status"] == "applied"
          assert svc("status", "/tmp/svc-cli-project", "--json")["healthy"] is True
          PYTHON
          /tmp/svc-wheel/bin/svc double validate cli/tests/double/fixtures/language/payment.double.yaml --json
      - name: Accept separately released Skills with the built CLI
        run: |
          pdm run build-corpus-archive --output-dir /tmp/svc-skills
          mkdir -p /tmp/svc-skills-project
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def svc(*args):
              return json.loads(subprocess.check_output(["/tmp/svc-wheel/bin/svc", "skills", *args], text=True))

          scope = ("--repo", "/tmp/svc-skills-project", "--agent", "codex", "--json")
          for archive in sorted(Path("/tmp/svc-skills").glob("*.zip")):
              install = ("install", *scope, "--archive", str(archive))
              plan = svc(*install)
              assert plan["status"] == "ready"
              assert svc(*install, "--apply", plan["plan_digest"])["status"] == "applied"
          assert len(svc("status", *scope)["targets"][0]["units"]) == 6
          adoption = svc("adopt", *scope)
          assert svc("adopt", *scope, "--apply", adoption["plan_digest"])["status"] == "applied"
          assert "every non-trivial task" in Path("/tmp/svc-skills-project/AGENTS.md").read_text()
          removal = svc("remove", *scope)
          assert svc("remove", *scope, "--apply", removal["plan_digest"])["status"] == "applied"
          assert "svc:begin adoption" in Path("/tmp/svc-skills-project/AGENTS.md").read_text()
          PY
      - name: Verify independent CLI archives
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel, = Path("cli/dist").glob("*.whl")
          sdist, = Path("cli/dist").glob("*.tar.gz")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert not any("/corpus/" in name or name.endswith("catalog.json") for name in names)
              assert any(name.endswith("/licenses/LICENSE") for name in names)
          with tarfile.open(sdist) as archive:
              assert not any("/corpus/" in name or "_build_inputs" in name for name in archive.getnames())
              assert any(name.endswith("/LICENSE") for name in archive.getnames())
          PY
          python -m pip wheel --no-deps cli/dist/*.tar.gz --wheel-dir /tmp/svc-isolated-build

  python-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version: "3.14"
          version: 2.28.0
          cache: true
      - run: pdm install --frozen-lockfile -d -G test -G double
      - run: pdm run test
