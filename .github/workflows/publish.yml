name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build or resume.
        required: true
        type: string
      bundle_run_id:
        description: Existing Publish run whose verified bundle must be reused.
        required: false
        type: string
permissions:
  contents: read

concurrency:
  group: svc-publish-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          BUNDLE_RUN_ID: ${{ inputs.bundle_run_id }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="$PUSH_TAG"
          else
            tag="$INPUT_TAG"
          fi
          test -n "$tag"
          if [[ -n "$BUNDLE_RUN_ID" && ! "$BUNDLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "bundle_run_id must be a positive workflow run ID" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bundle_run_id=$BUNDLE_RUN_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git fetch --force --tags origin main
          commit=$(git rev-parse "$TAG^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - if: steps.target.outputs.bundle_run_id == ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - if: steps.target.outputs.bundle_run_id == ''
        run: python -m pip install pdm==2.27.0
      - if: steps.target.outputs.bundle_run_id == ''
        run: pdm lock --check
      - if: steps.target.outputs.bundle_run_id == ''
        run: pdm install --frozen-lockfile -d -G release -G test
      - name: Verify the tag-bound release source
        if: steps.target.outputs.bundle_run_id == ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: pdm run release verify-tag --tag "$TAG" --commit "$COMMIT" --json
      - if: steps.target.outputs.bundle_run_id == ''
        run: |
          pdm run test
          pdm run build-monolith
      - if: steps.target.outputs.bundle_run_id == ''
        run: pdm build --dest dist/python
      - name: Smoke-test the exact release wheel
        if: steps.target.outputs.bundle_run_id == ''
        run: |
          python -m venv /tmp/svc-release
          /tmp/svc-release/bin/pip install dist/python/*.whl
          /tmp/svc-release/bin/svc --help
          /tmp/svc-release/bin/svc lookup --name 'sections/working-protocol\.md' --json
      - name: Create one manifest-bound release bundle
        if: steps.target.outputs.bundle_run_id == ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          pdm run release bundle --tag "$TAG" --commit "$COMMIT" \
            --dist-dir dist/python --bundle-dir dist/release --json
      - if: steps.target.outputs.bundle_run_id == ''
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/release/python/*
      - name: Recover the preserved release bundle
        if: steps.target.outputs.bundle_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svc-release-${{ steps.target.outputs.tag }}
          path: dist/release
          github-token: ${{ github.token }}
          run-id: ${{ steps.target.outputs.bundle_run_id }}
      - name: Verify the selected release bundle
        env:
          TAG: ${{ steps.target.outputs.tag }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          cmp tools/release.py dist/release/release-check.py
          bundle=$(python dist/release/release-check.py verify-bundle --bundle-dir dist/release --tag "$TAG" --json)
          bundle_commit=$(python -c 'import json,sys; print(json.load(sys.stdin)["commit"])' <<<"$bundle")
          test "$bundle_commit" = "$COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svc-release-${{ steps.target.outputs.tag }}
          path: dist/release
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svc-release-${{ needs.build.outputs.tag }}
          path: dist/release
      - name: Verify the downloaded release bundle
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: python dist/release/release-check.py verify-bundle --bundle-dir dist/release --tag "$TAG" --json
      - id: plan
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          plan=$(python dist/release/release-check.py pypi-plan --bundle-dir dist/release --tag "$TAG" --json)
          echo "needed=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["needed"]).lower())' <<<"$plan")" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.needed == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/release/python/

  finalize-github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.build.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svc-release-${{ needs.build.outputs.tag }}
          path: dist/release
      - name: Finalize the manifest-bound GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bundle=$(python dist/release/release-check.py verify-bundle --bundle-dir dist/release --tag "$TAG" --json)
          version=$(python -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<<"$bundle")
          notes=$(python -c 'import json,sys; print(json.load(sys.stdin)["notes"])' <<<"$bundle")
          assets=$(python -c 'import json,sys; print("\n".join(json.load(sys.stdin)["assets"]))' <<<"$bundle")
          if release_state=$(gh release view "$TAG" --json isDraft,name,body 2>/dev/null); then
            draft=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' <<<"$release_state")
            python -c 'import json,pathlib,sys; state=json.load(sys.stdin); expected=pathlib.Path(sys.argv[2]).read_text(encoding="utf-8").rstrip("\n"); actual=state.get("body"); name=f"SVC {sys.argv[1]}"; raise SystemExit(0 if state.get("name") == name and isinstance(actual,str) and actual.rstrip("\n") == expected else "Existing GitHub Release title or notes differ from the manifest-bound bundle")' "$version" "dist/release/$notes" <<<"$release_state"
          else
            gh release create "$TAG" --draft --verify-tag --title "SVC $version" --notes-file "dist/release/$notes"
            draft=true
          fi
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          mkdir -p /tmp/svc-release-assets
          while IFS= read -r relative; do
            test -n "$relative"
            asset="$(basename "$relative")"
            local="dist/release/$relative"
            if grep -Fxq -- "$asset" <<<"$existing"; then
              gh release download "$TAG" --pattern "$asset" --dir /tmp/svc-release-assets
              cmp "$local" "/tmp/svc-release-assets/$asset"
            elif [[ "$draft" == "true" ]]; then
              gh release upload "$TAG" "$local"
            else
              echo "Published GitHub Release is missing manifest-bound asset: $asset" >&2
              exit 1
            fi
          done <<<"$assets"
          if [[ "$draft" == "true" ]]; then
            gh release edit "$TAG" --draft=false
          fi
