name: Publish

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: read

concurrency:
  group: svc-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Read prepared release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: latest
        name: Read the prepared release version
        uses: miniscruff/changie-action@11bcad388e7973948cbcecb10863baf024d5f607 # v3.0.0
        with:
          version: v1.25.1
          args: latest
      - id: release
        name: Bind the prepared version
        env:
          TAG: ${{ steps.latest.outputs.output }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Changie returned an invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          test -s "changes/$TAG.md"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-list -n 1 "$TAG")" == "$GITHUB_SHA" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build release distributions
    if: needs.prepare.outputs.publish == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.28.0
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test -G double
      - name: Validate release projections and Corpus advancement
        env:
          SVC_BASE_REF: ${{ github.event.before }}
        run: pdm run check-release-projections --compare-ref "$SVC_BASE_REF"
      - name: Validate CLI output schema projections and compatibility
        env:
          SVC_BASE_REF: ${{ github.event.before }}
        run: pdm run check-cli-output-schemas --compare-ref "$SVC_BASE_REF"
      - name: Build the tagged distributions
        env:
          PDM_BUILD_SCM_VERSION: ${{ needs.prepare.outputs.version }}
        run: pdm build -p svc_cli --dest ../release/python
      - name: Smoke-test the installed wheel
        run: |
          wheel=(release/python/*.whl)
          test "${#wheel[@]}" -eq 1
          mkdir -p /tmp/svc-release-wheelhouse
          python -m pip download --dest /tmp/svc-release-wheelhouse "${wheel[0]}"
          sha=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${wheel[0]}")
          python tools/accept_agent_thread.py \
            --slice all \
            --wheel "${wheel[0]}" \
            --expected-sha256 "$sha" \
            --wheelhouse /tmp/svc-release-wheelhouse
          python -m venv /tmp/svc-release
          /tmp/svc-release/bin/pip install release/python/*.whl
          /tmp/svc-release/bin/svc --help
          for operation in validate start emit observe stop; do
            /tmp/svc-release/bin/svc double "$operation" --json-schema >/dev/null
          done
          /tmp/svc-release/bin/python -c \
            'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("cel_expr_python", "jsonschema", "referencing", "ruamel"))'
          set +e
          unavailable=$(/tmp/svc-release/bin/svc double validate /dev/null --json)
          unavailable_status=$?
          set -e
          test "$unavailable_status" -eq 3
          /tmp/svc-release/bin/python -c \
            'import json,sys; value=json.load(sys.stdin); assert value == {"schema_version":1,"command":"double validate","status":"double-runtime-unavailable","continuation":"pip install '\''sustainable-vibe-coding[double]'\''"}' \
            <<<"$unavailable"
          /tmp/svc-release/bin/svc run --json-schema
          /tmp/svc-release/bin/svc lookup --path working-protocol/ --json
          repo=$(mktemp -d)
          plan=$(/tmp/svc-release/bin/svc init "$repo" --json)
          digest=$(python -c 'import json,sys; print(json.load(sys.stdin)["plan_digest"])' <<<"$plan")
          /tmp/svc-release/bin/svc init "$repo" --apply "$digest"
          /tmp/svc-release/bin/svc status "$repo"
      - name: Smoke-test the same wheel with the double extra
        run: |
          wheel=(release/python/*.whl)
          test "${#wheel[@]}" -eq 1
          python -m venv /tmp/svc-release-double
          double_wheel="${wheel[0]}[double]"
          /tmp/svc-release-double/bin/pip install "$double_wheel"
          fixture="$GITHUB_WORKSPACE/svc_cli/tests/double/fixtures/language/payment.double.yaml"
          smoke=$(mktemp -d)
          cat >"$smoke/callback.py" <<'PY'
          import http.server
          import pathlib
          import sys

          class Callback(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers.get("Content-Length", "0")))
                  self.send_response(204)
                  self.end_headers()

              def log_message(self, format, *args):
                  pass

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Callback)
          pathlib.Path(sys.argv[1]).write_text(str(server.server_address[1]))
          server.serve_forever()
          PY
          /tmp/svc-release-double/bin/python "$smoke/callback.py" "$smoke/port" &
          callback_pid=$!
          trap 'kill "$callback_pid" 2>/dev/null || true' EXIT
          for _ in {1..100}; do
            test -s "$smoke/port" && break
            sleep 0.05
          done
          test -s "$smoke/port"
          callback_origin="http://127.0.0.1:$(cat "$smoke/port")"

          cd "$smoke"
          /tmp/svc-release-double/bin/svc double validate "$fixture" --json >/dev/null
          start=$(/tmp/svc-release-double/bin/svc double start "$fixture" \
            --seed 7 \
            --clock 2026-08-10T02:00:00Z \
            --target "consumer.payment-events=$callback_origin" \
            --json)
          run_id=$(/tmp/svc-release-double/bin/python -c \
            'import json,sys; print(json.load(sys.stdin)["run_id"])' <<<"$start")
          responder=$(/tmp/svc-release-double/bin/python -c \
            'import json,sys; print(json.load(sys.stdin)["responder_url"])' <<<"$start")
          /tmp/svc-release-double/bin/python - "$responder" <<'PY'
          import json
          import sys
          import urllib.request

          request = urllib.request.Request(
              sys.argv[1] + "/v1/payments?observed-at=2026-08-10T02%3A00%3A00Z&trace=trace-001",
              data=json.dumps({"externalId": "00000000-0000-4000-8000-000000000001"}).encode(),
              headers={
                  "Content-Type": "application/json",
                  "X-Request-Id": "00000000-0000-4000-8000-000000000002",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              assert response.status == 201
          PY
          /tmp/svc-release-double/bin/svc double emit "$run_id" payment.succeeded --json >/dev/null
          /tmp/svc-release-double/bin/svc double observe "$run_id" --json >/dev/null
          /tmp/svc-release-double/bin/svc double stop "$run_id" --json >/dev/null
          /tmp/svc-release-double/bin/svc double stop "$run_id" --json >/dev/null
      - name: Add the prepared release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: cp "changes/$TAG.md" release/notes.md
      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: svc-release-${{ needs.prepare.outputs.tag }}
          path: release
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Create release tag
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $TAG"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$TAG"

  publish-pypi:
    name: Publish to PyPI
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, tag]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download the release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svc-release-${{ needs.prepare.outputs.tag }}
          path: release
      - name: Publish the distributions
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release/python/
          skip-existing: true

  github-release:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, tag, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: svc-release-${{ needs.prepare.outputs.tag }}
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" release/python/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file release/notes.md
