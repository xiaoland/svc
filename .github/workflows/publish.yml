name: Publish Release PR

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authorize:
    if: "!github.event.created && !github.event.deleted && !github.event.forced"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skills: ${{ steps.plan.outputs.skills }}
      cli: ${{ steps.plan.outputs.cli }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Verify the release plan and its merged PR
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- .release-plan.json; then
            exit 0
          fi
          git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA"
          # The push revision must be the merge result, not a later main commit.
          pr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(
              .merged_at and .merge_commit_sha == env.GITHUB_SHA
              and .base.sha == env.BEFORE and .base.ref == "main"
              and .base.repo.full_name == env.GITHUB_REPOSITORY
              and .head.repo.full_name == env.GITHUB_REPOSITORY
              and (.head.ref | startswith("release/"))
            ) | .number')
          if ! [[ "$pr" =~ ^[1-9][0-9]*$ ]]; then
            echo "Expected exactly one merged Release PR for $GITHUB_SHA" >&2
            exit 1
          fi
          python -m tools.release_pr check --base "$BEFORE" --require-plan --github-output "$GITHUB_OUTPUT"

  skills:
    needs: authorize
    if: needs.authorize.outputs.skills != ''
    uses: ./.github/workflows/publish-corpus.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.authorize.outputs.skills }}

  cli:
    needs: [authorize, skills]
    if: >-
      !cancelled() && needs.authorize.result == 'success' && needs.authorize.outputs.cli != '' &&
      (needs.skills.result == 'success' || needs.skills.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: svc-cli-publish
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pdm-project/setup-pdm@973541a5febeafcfdadf8a51211435be6ecfd90f # v4.5
        with:
          python-version: "3.11"
          version: 2.28.0
          cache: true
      - run: pdm lock --check
      - run: pdm install --frozen-lockfile -d -G quality -G test -G double
      - id: release
        name: Bind the prepared static version
        env:
          VERSION: ${{ needs.authorize.outputs.cli }}
        run: |
          test "$(python -c 'import tomllib; from tools.cli_release import cli_release_version; print(cli_release_version(tomllib.load(open("cli/pyproject.toml", "rb"))["project"]["version"]))')" = "$VERSION"
          python -m tools.release_notes CLI_CHANGELOG.md "$VERSION" --output /tmp/cli-release-notes.md
          echo "tag=svc-cli-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Check prepared release
        env:
          SVC_BASE_REF: ${{ github.event.before }}
        run: pdm run check
      - run: pdm build -p cli --dest ../release/python
      - name: Normalize the sdist gzip timestamp for exact retries
        run: |
          python - <<'PYTHON'
          import gzip
          import os
          from pathlib import Path

          sdist, = Path("release/python").glob("*.tar.gz")
          contents = gzip.decompress(sdist.read_bytes())
          sdist.write_bytes(gzip.compress(contents, mtime=int(os.environ["SOURCE_DATE_EPOCH"])))
          PYTHON
      - name: Accept the built wheel
        run: |
          wheel=(release/python/*.whl)
          test "${#wheel[@]}" -eq 1
          mkdir -p /tmp/svc-release-wheelhouse
          python -m pip download --dest /tmp/svc-release-wheelhouse "${wheel[0]}"
          sha=$(python -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${wheel[0]}")
          python tools/accept_agent_thread.py --slice all --wheel "${wheel[0]}" --expected-sha256 "$sha" --wheelhouse /tmp/svc-release-wheelhouse
      - name: Accept public Skills with the built wheel
        env:
          SKILLS_VERSION: ${{ needs.authorize.outputs.skills }}
        run: |
          wheel=(release/python/*.whl)
          python -m venv "$RUNNER_TEMP/svc-skills-wheel"
          "$RUNNER_TEMP/svc-skills-wheel/bin/pip" install --no-index --find-links /tmp/svc-release-wheelhouse "${wheel[0]}"
          "$RUNNER_TEMP/svc-skills-wheel/bin/python" - <<'PYTHON'
          import os
          from svc_cli.skills import resolve_release

          manifest = resolve_release(os.environ["SKILLS_VERSION"] or None).manifest
          print("Verified public Skills release:", manifest.release_tag)
          PYTHON
      - name: Check for conflicting PyPI distributions
        run: python -m tools.check_pypi_release release/python
      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG" "$GITHUB_SHA"
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "refs/tags/$TAG"
          fi
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release/python/
          skip-existing: true
      - name: Verify uploaded PyPI distributions
        run: python -m tools.check_pypi_release release/python --complete
      - name: Preserve the Python filenames in the GitHub download
        env:
          VERSION: ${{ needs.authorize.outputs.cli }}
        run: python -m tools.cli_release "release/github/svc-cli-$VERSION-python.zip" release/python/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --notes-file /tmp/cli-release-notes.md --title "$TAG"
          fi
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          while IFS= read -r name; do
            [ -z "$name" ] || [ -f "release/github/$name" ]
          done <<< "$existing"
          for asset in release/github/*; do
            directory=$(mktemp -d)
            name=$(basename "$asset")
            if grep -Fxq -- "$name" <<< "$existing"; then
              gh release download "$TAG" --pattern "$name" --dir "$directory"
              cmp -- "$asset" "$directory/$name"
            else
              test "$draft" = "true"
              gh release upload "$TAG" "$asset"
            fi
            rm -rf "$directory"
          done
          if [ "$draft" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          fi

  macos:
    needs: [authorize, skills, cli]
    if: >-
      !cancelled() && needs.authorize.result == 'success' && needs.authorize.outputs.macos != '' &&
      (needs.skills.result == 'success' || needs.skills.result == 'skipped') &&
      (needs.cli.result == 'success' || needs.cli.result == 'skipped')
    uses: ./.github/workflows/macos.yml
    permissions:
      contents: write
    with:
      publish: true
