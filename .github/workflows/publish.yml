name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svc-publish
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    # GitHub exposes draft releases only to a token with write-level contents access.
    # This job uses that access only for the read-only Releases API state query below.
    permissions:
      contents: write
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm install --frozen-lockfile -d -G release
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(pdm run release publish-plan --json)
          needed=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["needed"]).lower())' <<<"$plan")
          mode=create
          if [[ "$plan" == *'"version"'* ]]; then
            version=$(python -c 'import json,sys; print(json.load(sys.stdin)["version"])' <<<"$plan")
            tag=$(python -c 'import json,sys; print(json.load(sys.stdin)["tag"])' <<<"$plan")
            # A tag is only an intermediate checkpoint. A missing or draft GitHub
            # Release means a prior publish attempt did not complete, so resume it.
            if [[ "$needed" != "true" ]]; then
              draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                --jq ".[] | select(.tag_name == \"$tag\") | .draft" | head -n 1)
              if [[ -z "$draft" ]]; then
                needed=true
                mode=resume-tag
              elif [[ "$draft" == "true" ]]; then
                needed=true
                mode=resume-draft
              fi
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Restore tagged release source for a resumed publish
        env:
          MODE: ${{ needs.detect.outputs.mode }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          if [[ "$MODE" != "create" ]]; then
            git checkout "$TAG"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install pdm==2.27.0
      - run: pdm install --frozen-lockfile -d -G release
      - run: |
          pdm run release verify-prepared
          pdm run test
          pdm run build-monolith
      - if: needs.detect.outputs.mode != 'resume-draft'
        run: |
          pdm build --dest dist/python
      - if: needs.detect.outputs.mode != 'resume-draft'
        name: Smoke-test release wheel
        run: |
          python -m venv /tmp/svc-release
          /tmp/svc-release/bin/pip install dist/python/*.whl
          /tmp/svc-release/bin/svc --help
          /tmp/svc-release/bin/svc lookup --name 'sections/working-protocol\.md' --json
      - if: needs.detect.outputs.mode != 'resume-draft'
        name: Assemble release assets once
        run: |
          mkdir -p dist/release
          cp dist/python/* dist/release/
          cp src/manifest.json dist/release/svc-release-metadata.json
          (cd dist/release && sha256sum * > SHA256SUMS)
      - if: needs.detect.outputs.mode != 'resume-draft'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/release/*
      - if: needs.detect.outputs.mode != 'resume-draft'
        name: Create tag and draft release without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pdm run release notes --json | python -c 'import json,sys; print(json.load(sys.stdin)["notes"])' > /tmp/release-notes.md
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "SVC $VERSION"
            git push origin "$TAG"
          fi
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "SVC $VERSION" --notes-file /tmp/release-notes.md
          fi
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --dir /tmp/release-assets || true
          for asset in dist/release/*; do
            name=$(basename "$asset")
            if [[ -f "/tmp/release-assets/$name" ]]; then
              cmp "$asset" "/tmp/release-assets/$name"
            else
              gh release upload "$TAG" "$asset"
            fi
          done
      - if: needs.detect.outputs.mode == 'resume-draft'
        name: Restore immutable draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          mkdir -p dist/release dist/python
          gh release download "$TAG" --dir dist/release
          (cd dist/release && sha256sum --check SHA256SUMS)
          cp dist/release/*.whl dist/release/*.tar.gz dist/python/
      - id: pypi
        run: |
          plan=$(pdm run release pypi-plan --dist-dir dist/python --json)
          echo "needed=$(python -c 'import json,sys; print(str(json.load(sys.stdin)["needed"]).lower())' <<<"$plan")" >> "$GITHUB_OUTPUT"
      - if: steps.pypi.outputs.needed == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/python/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
