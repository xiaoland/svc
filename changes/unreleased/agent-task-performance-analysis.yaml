kind: major
body: >-
  SVC 12.0.0 replaces telemetry schema-v2 normalized-only `analyze`/TUI with a schema-v3 three-member native evidence core, an optional rebuildable trajectory cache, and the Agent-facing `analysis query|read` contract with typed cursor scopes; existing v1/v2 bundles require recollection and removed privacy/output controls no longer apply.
