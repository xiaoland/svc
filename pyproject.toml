[project]
name = "svc-doc-tools"
version = "0.1.0"
description = "Utility scripts for building consolidated documentation."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
build-monolith = "python -m src.tools.build_monolith"
install-agents = "python -m src.tools.install_agents"
test = "python -m unittest discover -s tests -p 'test_*.py'"
